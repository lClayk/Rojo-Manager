[package]
name = "rojo-manager"
description = "Rojo Manager tray app; its native window runs as a separate process only while it is open"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "RojoManager"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
rojo-manager-core.workspace = true
gpui-kit = "0.9"
tray-icon = "0.26"
async-channel = "2.5"
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace]
members = ["crates/core", "crates/app", "crates/mcp", "crates/installer"]
# Vendored crates patched in through [patch.crates-io] below (see patches/README.md); not ours to lint.
exclude = ["patches"]
resolver = "3"

[workspace.package]
version = "0.7.6"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
rojo-manager-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[patch.crates-io]
gpui-pre-windows = { path = "patches/gpui-pre-windows" }
